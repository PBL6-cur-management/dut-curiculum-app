name: dut_curriculum_app
description: "dDUT-style student shell and curriculum management client."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_widget_from_html_core: ^0.17.4
  get_it: ^9.3.0
  go_router: ^17.5.0
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  open_filex: ^5.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.11.2
  injectable_generator: ^2.9.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
